name: Format
description: Format sources
inputs:
  dispatch-workflow:
    description: >-
      Set to 'true' to start the running workflow itself with workflow_dispatch on the pushed branch
      after a format diff is committed and pushed, so that required checks run on the new commit.
      Requires the workflow to have a workflow_dispatch trigger and the job to have the actions: write permission.
      Runs started by workflow_dispatch never dispatch again.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - run: pnpm format
      shell: bash
    - uses: tuqulore/.github/configure-git@862223e87aebb86ee0e7e2db495d65dc441b31df # main
    - name: Commit a diff
      id: commit
      env:
        REF: ${{ github.ref }}
      run: |
        if git commit -am "format [skip ci]"
        then
          git push origin "HEAD:${REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
    # GITHUB_TOKEN による push では他のワークフローが起動しないため、push したコミットに対して
    # 実行中のワークフロー自身を workflow_dispatch で起動し直す。
    # workflow_dispatch で起動された実行からは再度 dispatch しない (無限ループ防止)。
    - name: Dispatch this workflow for the pushed commit
      if: >-
        inputs.dispatch-workflow == 'true' &&
        steps.commit.outputs.pushed == 'true' &&
        github.event_name != 'workflow_dispatch' &&
        startsWith(github.ref, 'refs/heads/')
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        BRANCH: ${{ github.ref_name }}
      run: |
        # github.workflow_ref は "owner/repo/.github/workflows/ci.yml@refs/heads/main" の形式
        WORKFLOW_PATH="${WORKFLOW_REF%%@refs/*}"
        WORKFLOW_FILE="${WORKFLOW_PATH##*/}"
        gh workflow run "${WORKFLOW_FILE}" --repo "${REPOSITORY}" --ref "${BRANCH}"
      shell: bash
