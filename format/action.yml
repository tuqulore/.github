name: Format
description: Format sources
outputs:
  pushed:
    description: >-
      'true' if a format diff was committed and pushed, otherwise 'false'.
      Use it to start required-check workflows with workflow_dispatch from a separate job,
      because pushes made with GITHUB_TOKEN do not trigger other workflows.
    value: ${{ steps.commit.outputs.pushed }}
runs:
  using: composite
  steps:
    - run: pnpm format
      shell: bash
    - uses: tuqulore/.github/configure-git@862223e87aebb86ee0e7e2db495d65dc441b31df # main
    - name: Commit a diff
      id: commit
      env:
        REF: ${{ github.ref }}
      run: |
        if git commit -am "format [skip ci]"
        then
          git push origin "HEAD:${REF}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        else
          echo "pushed=false" >> "$GITHUB_OUTPUT"
        fi
      shell: bash
