name: Format
description: Format sources
runs:
  using: composite
  steps:
    - run: pnpm format
      shell: bash
    - uses: tuqulore/.github/configure-git@cc8a49114d24092c90de619edef3518534fb074e # main
    - name: Commit a diff
      run: |
        if git commit -am "format [skip ci]"
        then
          git push origin HEAD:${{ github.ref }}
        fi
      shell: bash
